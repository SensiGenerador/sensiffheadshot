<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensiHeadshot - Configuración Free Fire</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        h1 { color: #ff4500; }
        .card { background: #1e1e1e; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 10px; border: 1px solid #ff4500; }
        ul { list-style: none; padding: 0; text-align: left; }
        li { padding: 8px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .val { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎯 SensiHeadshot</h1>
    <p>Las mejores configuraciones para dar todo rojo en Free Fire.</p>

    <div class="card">
        <h2>Configuración Recomendada</h2>
        <ul>
            <li>General: <span class="val">98%</span></li>
            <li>Mira de Punto Rojo: <span class="val">95%</span></li>
            <li>Mira 2x: <span class="val">90%</span></li>
            <li>Mira 4x: <span class="val">88%</span></li>
            <li>Francotirador: <span class="val">50%</span></li>
            <li>Cámara: <span class="val">100%</span></li>
        </ul>
    </div>

</body>
</html>
